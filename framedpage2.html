<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Framed Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #top-banner {
            width: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            padding: 5px;
            gap: 5px;
            flex-shrink: 0;
        }

        #top-banner a {
            flex: 1;
            max-width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #top-banner a img {
            width: 100%;
            height: auto;
            display: block;
            max-height: 150px;
            object-fit: contain;
        }

        #bottom-frame {
            width: 100%;
            border: none;
        }

        .page-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .frame-wrapper {
            flex: 1;
            width: 100%;
            min-height: 0;
        }

        .frame-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div id="top-banner">
            <a href="https://llclick.com/2vwkvwdw/buildyframepagebanner" target="_blank" rel="noopener noreferrer">
                <img src="https://iili.io/BwtzuKx.png" alt="Left Banner">
            </a>
            <a href="https://llclick.com/gh86wzrt/buildyframepagebanner" target="_blank" rel="noopener noreferrer">
                <img src="https://iili.io/dgZszpp.png" alt="Right Banner">
            </a>
        </div>
        <div class="frame-wrapper">
            <iframe src="https://lltrco.com/?r=jimmyboyd" id="bottom-frame" allowfullscreen></iframe>
        </div>
    </div>
</body>
</html>
